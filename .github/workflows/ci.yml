name: PROHOR checks
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run build
      - run: npm run check:contrast
# npm ci requires committed package-lock.json, produced on Day 1 after npm install.
